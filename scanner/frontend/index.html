<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt scanner</title>
  <style>
    :root { --ok: #22c55e; --bad: #ef4444; --warn: #f97316; --found: #3b82f6; --fg: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #stage { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; touch-action: manipulation; }
    #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--fg); text-align: center; padding: 20px; background: #000; }
    #placeholder p { margin: 0; color: var(--muted); font-size: 14px; max-width: 320px; line-height: 1.4; }
    #banner { position: absolute; top: 0; left: 0; right: 0; padding: 10px 12px 14px; background: linear-gradient(rgba(15, 23, 42, .85), rgba(15, 23, 42, 0)); color: var(--fg); pointer-events: none; }
    #banner b { display: block; font-size: 15px; }
    #banner span { display: block; font-size: 13px; color: #cbd5e1; margin-top: 2px; line-height: 1.35; }
    #banner:empty { display: none; }
    #hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: rgba(15, 23, 42, .8); color: var(--fg); font-size: 13px; white-space: nowrap; pointer-events: none; }
    #hint:empty { display: none; }
    #hud { position: absolute; top: 6px; right: 6px; padding: 3px 8px; border-radius: 6px; background: rgba(15, 23, 42, .7); color: var(--muted); font: 10px ui-monospace, Menlo, Consolas, monospace; pointer-events: none; }
    #hud:empty { display: none; }
    #bar { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1 1 0; min-height: 48px; border: 0; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; background: #1e293b; color: var(--fg); }
    button.primary { background: #2563eb; flex-grow: 2; }
    button:disabled { opacity: .45; cursor: default; }
    button[hidden] { display: none; }
    #start-big { flex: none; padding: 0 28px; background: #2563eb; }
    #legend { display: flex; gap: 14px; padding: 6px 0 2px; font-size: 12px; color: #64748b; flex-wrap: wrap; }
    #legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    #legend .g { color: var(--ok); } #legend .r { color: var(--bad); } #legend .o { color: var(--warn); } #legend .b { color: var(--found); }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Version 2: guided photos (main.js) -->
  <template id="guided">
    <div id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div id="banner"></div>
      <div id="hint"></div>
      <div id="placeholder">
        <button id="start-big">Start camera</button>
        <p id="status">Loading OCR models...</p>
      </div>
    </div>
    <div id="bar">
      <button id="shoot" class="primary" disabled>Take picture</button>
      <button id="retake" hidden>Retake</button>
      <button id="torch" hidden>Light</button>
    </div>
    <div id="legend"><span class="b">found</span><span class="g">read clearly</span><span class="r">unsure</span></div>
  </template>

  <!-- Version 1: live scan (live/*.js) -->
  <template id="live">
    <div id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div id="placeholder">
        <button id="start-big">Start camera</button>
        <p id="status">Loading OCR models...</p>
      </div>
      <div id="hud"></div>
      <div id="hint"></div>
    </div>
    <div id="bar">
      <button id="pause" disabled>Pause</button>
      <button id="torch" hidden>Light</button>
      <button id="reset">New receipt</button>
    </div>
    <div id="legend"><span class="g">confirmed</span><span class="r">uncertain</span><span class="o">items don't add up</span></div>
  </template>

  <script>
    // Which version to start comes with Streamlit's first render ("mode" argument), so ask for it,
    // keep that render for the version's script to replay, then load the script tagged with the code
    // fingerprint from build.json (written by the Python side) so phones never run cached old code.
    (async () => {
      const firstRender = new Promise((resolve) => {
        window.addEventListener("message", function first(e) {
          if (e.data && e.data.type === "streamlit:render") {
            window.removeEventListener("message", first);
            resolve(e.data);
          }
        });
      });
      window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
      let v = String(Date.now());
      try {
        v = (await (await fetch("build.json", { cache: "no-store" })).json()).v || v;
      } catch (_) { /* no fingerprint: the timestamp still avoids stale code */ }
      window.SCANNER_VERSION = v;
      window.__firstRender = await firstRender;
      const live = (window.__firstRender.args || {}).mode === "live";
      document.getElementById("app").appendChild(document.getElementById(live ? "live" : "guided").content.cloneNode(true));
      const scripts = live ? ["live/tracker.js", "live/motion.js", "live/main.js"] : ["main.js"];
      for (const src of scripts) {
        await new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = `${src}?v=${v}`;
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      }
    })();
  </script>
</body>
</html>
