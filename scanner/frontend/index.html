<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt scanner</title>
  <style>
    :root { --ok: #22c55e; --bad: #ef4444; --warn: #f97316; --fg: #f8fafc; --muted: #94a3b8; --panel: #0f172a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #stage { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; touch-action: manipulation; }
    #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--fg); text-align: center; padding: 20px; }
    #placeholder p { margin: 0; color: var(--muted); font-size: 14px; max-width: 320px; line-height: 1.4; }
    #hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: rgba(15, 23, 42, .78); color: var(--fg); font-size: 13px; white-space: nowrap; pointer-events: none; transition: opacity .2s; }
    #hint:empty { opacity: 0; }
    #hud { position: absolute; top: 6px; right: 6px; padding: 3px 8px; border-radius: 6px; background: rgba(15, 23, 42, .7); color: var(--muted); font: 10px ui-monospace, Menlo, Consolas, monospace; pointer-events: none; }
    #bar { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    button { flex: 1 1 0; min-height: 44px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; background: #1e293b; color: var(--fg); }
    button.primary { background: #2563eb; }
    button:disabled { opacity: .45; cursor: default; }
    button[hidden] { display: none; }
    #start-big { flex: none; padding: 0 28px; background: #2563eb; }
    #legend { display: flex; gap: 14px; padding: 6px 0 2px; font-size: 12px; color: #64748b; flex-wrap: wrap; }
    #legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    #legend .g { color: var(--ok); } #legend .r { color: var(--bad); } #legend .o { color: var(--warn); }
  </style>
</head>
<body>
  <div id="app">
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="placeholder">
      <button id="start-big">Start camera</button>
      <p id="status">Loading OCR models...</p>
    </div>
    <div id="hud"></div>
    <div id="hint"></div>
  </div>
  <div id="bar">
    <button id="pause" disabled>Pause</button>
    <button id="torch" hidden>Light</button>
    <button id="reset">New receipt</button>
  </div>
  <div id="legend"><span class="g">confirmed</span><span class="r">uncertain</span><span class="o">items don't add up</span></div>
  </div>
  <script src="tracker.js?v=14"></script>
  <script src="motion.js?v=14"></script>
  <script src="main.js?v=14"></script>
</body>
</html>
