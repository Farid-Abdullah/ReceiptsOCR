# Copies the main branch to the Hugging Face Space, which then rebuilds and redeploys the app.
# Other branches are never deployed.
#
# Needs, in GitHub > Settings > Secrets and variables > Actions:
#   secret   HF_TOKEN     Hugging Face access token with write access to the Space
#   variable HF_USERNAME  your Hugging Face username
#   variable HF_SPACE     the Space id, e.g. your-username/ReceiptsOCR
name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        # --force: GitHub is the source of truth; this replaces the Space's starter commit on first run
        run: git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
